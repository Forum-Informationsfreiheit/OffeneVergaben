# Port 8080, not 80: under rootless podman the container runs as an unprivileged UID
# and may not bind a privileged port. compose publishes this as localhost:8000.
<VirtualHost *:8080>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        # public/.htaccess ships with the repo and holds the front-controller rewrite.
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
