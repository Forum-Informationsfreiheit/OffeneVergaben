; PHP settings for OffeneVergaben. Production defaults — the dev stage adds docker/php-dev.ini.

memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 64M
post_max_size = 64M
date.timezone = Europe/Vienna

; The code is baked into the prod image and never changes at runtime, so opcache does not need
; to check files for changes. A new deploy is a new container with an empty cache.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000

expose_php = Off
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr
